name: Auto lint-fix on PR

# PR の opened / synchronize で、その PR の変更/新規追加 TS/JS ファイルに
# `eslint --fix` を実行し、修正があれば同 PR に push back する。
# `eslint --fix` で直せない違反は PR コメントで manual fix 要を報告する。
#
# 経緯: 旧 `lint-fix-on-merge.yml` は Issue 作成 → Copilot Coding Agent assign の
#       フローだったが、`gh issue create --assignee Copilot` が GITHUB_TOKEN
#       (App installation token) では実行不可で workflow が常に失敗していた。
#       Issue は作られるが Copilot が起動せず放置される状態 (#192, #195, #197, #199, #201)
#       だったため、Actions 内で自走するシンプル設計に置換。
#
# 設計判断:
#   - 変更ファイルだけ対象 → 既存の 1500 件級違反を漸進的に解消
#   - same PR への commit back → 別 PR 経由のオーバーヘッドを避ける
#   - GITHUB_TOKEN で push するため、後続 CI workflow は自動 trigger されない
#     (GitHub 仕様)。マージ前に最終 CI を回したい場合は手動 re-push 等で対応。

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# 同一 PR への opened → synchronize 連続発火や複数 push の競合を防ぐ。
# 進行中のジョブはキャンセルして最新の head に追従する。
concurrency:
  group: lint-fix-on-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-fix:
    # 無限ループ予防 + フォーク PR 除外:
    # - copilot/ ブランチ (旧フロー残骸) は対象外
    # - chore/lint-fix-* (手動 lint-fix PR) は対象外
    # - フォーク PR では GITHUB_TOKEN が head リポジトリへの write 権限を持たず
    #   git push が失敗するため、同一リポジトリ内 PR に限定する
    # - lint-fix workflow が push した commit は github-actions[bot] 名義で、
    #   GITHUB_TOKEN による push は GitHub 仕様で workflow を再起動しないため
    #   追加ガードは不要
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'copilot/') &&
      !startsWith(github.head_ref, 'chore/lint-fix-')
    runs-on: ubuntu-latest

    steps:
      - name: PR ブランチをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: 変更/新規追加された TS/JS ファイルを抽出
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF" --depth=1

          # PR の base (main) と head の diff から、追加 (A) / 変更 (M) のみ抽出
          # 削除 (D) は対象外。リネーム (R) は新ファイル名側を採用
          git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" \
            | grep -E '\.(ts|tsx|js|jsx)$' \
            | grep -vE '^(node_modules|dist|build|\.next|coverage)/' \
            > changed_files.txt || true

          if [ ! -s changed_files.txt ]; then
            echo "TS/JS の追加/変更なし、lint-fix スキップ"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          file_count=$(wc -l < changed_files.txt)
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"

          echo "== 対象ファイル ($file_count 件) =="
          cat changed_files.txt

      - name: ESLint 実行前のエラー件数を記録
        if: steps.changed.outputs.skip != 'true'
        id: before
        run: |
          set -uo pipefail
          # ファイル名の空白/グロブメタ文字を安全に扱うため bash 配列で渡す
          mapfile -t files < changed_files.txt
          # --format json で集計。failure 時も件数取得目的で非 0 exit を許容
          npx eslint "${files[@]}" --format json > eslint_before.json 2>/dev/null || true
          before=$(jq '[.[].errorCount] | add // 0' eslint_before.json)
          : "${before:=0}"
          echo "count=$before" >> "$GITHUB_OUTPUT"
          echo "ESLint エラー (修正前): $before 件"

      - name: ESLint --fix を実行
        if: steps.changed.outputs.skip != 'true'
        run: |
          set -uo pipefail
          mapfile -t files < changed_files.txt
          # --fix は auto-fixable な違反のみ修正。直せないものは残る。
          # 非 0 exit はあり得る (残エラーで終了) ため許容
          npx eslint "${files[@]}" --fix || true

      - name: ESLint 実行後のエラー件数を記録 + 差分計算
        if: steps.changed.outputs.skip != 'true'
        id: after
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -uo pipefail
          mapfile -t files < changed_files.txt
          npx eslint "${files[@]}" --format json > eslint_after.json 2>/dev/null || true
          after=$(jq '[.[].errorCount] | add // 0' eslint_after.json)
          : "${after:=0}"
          # before は env 経由で bash 変数として読み込み、空展開リスクを回避
          before="${BEFORE:-0}"
          # ネット減少分。auto-fix が新たな違反を生んだ / push 中に違反追加されたケースでは
          # 負値・0 になり得るため、これは「正味の改善幅」であり「自動修正件数」ではない
          delta=$(( before - after ))
          echo "count=$after" >> "$GITHUB_OUTPUT"
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
          echo "ESLint エラー (修正後): $after 件 / 差分 (before - after): $delta 件"

      - name: working tree 変更検知 (push back 判定)
        if: steps.changed.outputs.skip != 'true'
        id: dirty
        run: |
          set -uo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 修正があれば同 PR に push back
        if: steps.changed.outputs.skip != 'true' && steps.dirty.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELTA: ${{ steps.after.outputs.delta }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          MSG=$(printf 'chore(lint): eslint --fix auto applied (PR #%s, delta %s)\n\nPR の変更/新規追加ファイルに対して `eslint --fix` を自動実行した結果。\nロジック変更なし、auto-fixable な違反のみ。delta は (修正前エラー数 - 修正後エラー数) のネット改善幅。\n\nWorkflow: .github/workflows/lint-fix-on-pr.yml\n' "${PR_NUMBER}" "${DELTA}")
          git commit -m "$MSG"
          git push

      - name: 残エラーを PR コメントで報告 (既存 bot コメントがあれば更新)
        if: steps.changed.outputs.skip != 'true' && steps.after.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
          AFTER: ${{ steps.after.outputs.count }}
          DELTA: ${{ steps.after.outputs.delta }}
          FILE_COUNT: ${{ steps.changed.outputs.file_count }}
          REPO: ${{ github.repository }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # 残エラーをルール別に集計 (上位 10 件)
          rule_breakdown=$(jq -r '
            [.[].messages[]?
              | select(.severity == 2)
              | .ruleId // "(unknown)"]
            | group_by(.)
            | map({rule: .[0], count: length})
            | sort_by(-.count)
            | .[:10]
            | .[]
            | "- `\(.rule)`: \(.count) 件"' eslint_after.json)

          # ファイル別の残エラー件数 (上位 10 件)
          # workspace 絶対パスを env 経由で渡してリポジトリ名ハードコードを回避
          file_breakdown=$(jq -r --arg ws "$WORKSPACE" '
            [.[] | select(.errorCount > 0) | {file: .filePath, count: .errorCount}]
            | sort_by(-.count)
            | .[:10]
            | .[]
            | "- `\(.file | sub("^"+$ws+"/"; ""))`: \(.count) 件"' eslint_after.json)

          MARKER='<!-- lint-fix-bot:summary -->'

          BODY=$(cat <<EOF
          ${MARKER}
          ## Auto lint-fix 結果

          | 項目 | 件数 |
          |---|---|
          | 対象ファイル | ${FILE_COUNT} 件 |
          | ESLint エラー (修正前) | ${BEFORE} 件 |
          | 自動修正による正味改善 (delta) | ${DELTA} 件 |
          | **残エラー (manual fix 要)** | **${AFTER} 件** |

          ### 残エラーのルール別内訳 (上位 10)

          ${rule_breakdown}

          ### 残エラーのファイル別件数 (上位 10)

          ${file_breakdown}

          ### このコメントについて

          - \`eslint --fix\` で自動解消できなかった違反です
          - \`unknown\` 型 / \`any\` 型 / unsafe-assignment 等、設計判断が要るものが中心
          - 既存の方針 (\`jsonSchemaToZod.ts:143\` 等) に沿って \`// eslint-disable-next-line <rule> -- 理由\` で限定許容するか、Zod 検証を入れて根本解消するか個別判断してください
          - 本コメントは同 PR の再 push ごとに更新されます (新規投稿で積み上がりません)
          - Workflow: \`.github/workflows/lint-fix-on-pr.yml\`
          EOF
          )

          # marker を含む既存 bot コメントを検索
          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${MARKER}\"))] | first | .id // empty")

          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" \
              --method PATCH \
              --field body="$BODY" >/dev/null
            echo "Updated existing comment: $existing_id"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
            echo "Posted new comment"
          fi

      - name: 修正完了サマリ (残エラーなし時、既存 bot コメントがあれば更新)
        if: steps.changed.outputs.skip != 'true' && steps.after.outputs.count == '0' && steps.dirty.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DELTA: ${{ steps.after.outputs.delta }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- lint-fix-bot:summary -->'
          BODY=$(cat <<EOF
          ${MARKER}
          ## Auto lint-fix 完了

          - 正味改善 (delta): **${DELTA} 件**
          - 残エラー: **0 件** ✅

          本コメントは同 PR の再 push ごとに更新されます。
          Workflow: \`.github/workflows/lint-fix-on-pr.yml\`
          EOF
          )

          existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${MARKER}\"))] | first | .id // empty")

          if [ -n "$existing_id" ]; then
            gh api "repos/${REPO}/issues/comments/${existing_id}" \
              --method PATCH \
              --field body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
