name: Production Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ai-note-486020
  GCP_REGION: asia-northeast1
  GCP_SERVICE_NAME: trader-note
  GCP_IMAGE: gcr.io/ai-note-486020/trader-note:latest
  GCP_ANALYSIS_SERVICE_NAME: trader-note-analysis-engine
  GCP_ANALYSIS_IMAGE: gcr.io/ai-note-486020/trader-note-analysis-engine:latest
  PRODUCTION_API_URL: https://trader-note-571157808050.asia-northeast1.run.app
  PRODUCTION_UI_URL: https://trader-note-build-ai.vercel.app

jobs:
  # ── 0. analysis-engine（Python）を Cloud Run にデプロイ ──
  deploy-analysis-engine:
    name: Deploy analysis-engine (Python) to GCP Cloud Run
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      analysis_url: ${{ steps.outputs.outputs.analysis_url }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI セットアップ
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Docker 認証設定
        run: gcloud auth configure-docker --quiet

      - name: コンテナイメージをビルド＆プッシュ（analysis-engine）
        run: |
          docker build -t ${{ env.GCP_ANALYSIS_IMAGE }} ./analysis-engine
          docker push ${{ env.GCP_ANALYSIS_IMAGE }}

      - name: Cloud Run へデプロイ（analysis-engine）
        # API 側と同じく --set-* で完全置換 + --quiet で非対話化。
        # 列挙外の env/secrets は削除されるため、deploy.yml が真実の唯一のソースになる。
        run: |
          gcloud run deploy ${{ env.GCP_ANALYSIS_SERVICE_NAME }} \
            --image ${{ env.GCP_ANALYSIS_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --set-env-vars NODE_ENV=production \
            --set-secrets ANALYSIS_DATABASE_URL=ANALYSIS_DATABASE_URL:latest

      - name: analysis-engine のURLを取得
        id: outputs
        run: |
          URL=$(gcloud run services describe ${{ env.GCP_ANALYSIS_SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "analysis_url=$URL" >> $GITHUB_OUTPUT
          echo "analysis-engine url: $URL"

      - name: analysis-engine ヘルスチェック（最大5分待機）
        run: |
          URL=$(gcloud run services describe ${{ env.GCP_ANALYSIS_SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          for i in {1..30}; do
            echo "確認中... ($i/30) url=$URL"
            if curl -s -f "$URL/health" > /dev/null 2>&1; then
              echo "✅ analysis-engine が正常に起動しました"
              exit 0
            fi
            sleep 10
          done
          echo "❌ analysis-engine の起動確認がタイムアウトしました"
          exit 1

  # ── 1. GCP Cloud Run（API）へのデプロイ ──
  deploy-gcp:
    name: Deploy API to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [deploy-analysis-engine]
    # CI 成功時のみ実行（手動実行時はスキップなし）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: production
      url: ${{ env.PRODUCTION_API_URL }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI セットアップ
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Docker 認証設定
        run: gcloud auth configure-docker --quiet

      - name: コンテナイメージをビルド＆プッシュ
        run: |
          docker build -t ${{ env.GCP_IMAGE }} .
          docker push ${{ env.GCP_IMAGE }}

      - name: Cloud Run へデプロイ
        # GCP Secret Manager の全 16 件 + plain env を Cloud Run に反映。
        # サービス再作成時の災害復旧でこの workflow 1 回で本番設定が完全再現できるようにする。
        #
        # 設計判断:
        # - --set-* (env-vars / secrets) を使い、列挙していない既存の env/secrets は削除する。
        #   これによりデプロイで設定ドリフトを解消し、deploy.yml 列挙が「真実の唯一のソース」になる。
        # - --allow-unauthenticated --quiet を明示。サービス新規作成時の対話プロンプトを回避し
        #   災害復旧シナリオでも非対話で完走できるようにする。
        # - --max-instances=5: pgBouncer pool 枯渇 (signal 11 segfault) 対策の一環。
        #   Prisma connection_limit=1 と組み合わせて 5 instance × 1 = 最大 5 connection に抑える。
        #   負荷観察後 (24h~) で安定が確認できたら段階的に max=10 / connection_limit=3 へ戻す方針。
        # - MARKET_API_URL と TWELVE_DATA_API_URL は同値で両方注入。コード側で参照箇所が分かれている
        #   (config/index.ts は MARKET_API_URL、TwelveDataProvider/fetchAndCacheOhlcv は TWELVE_DATA_API_URL)
        #   ため、片方だけだと一部コンポーネントに反映されない。
        #
        # 意図的に除外 (Secret Manager に存在するが Cloud Run runtime で未使用):
        # - DIRECT_URL: Prisma migration 専用、run-migration job (Cloud Run Job) で別途参照
        # - DATABASE_PASSWORD: 将来の DB パス分離管理用、現状 DATABASE_URL 内包
        # - VAPID_SUBJECT: Secret Manager 未登録、Web Push 動作確認後に必要なら追加
        run: |
          gcloud run deploy ${{ env.GCP_SERVICE_NAME }} \
            --image ${{ env.GCP_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --max-instances=5 \
            --set-env-vars NODE_ENV=production,MATCHING_ENGINE=lens,ANALYSIS_ENGINE_URL=${{ needs.deploy-analysis-engine.outputs.analysis_url }},PYTHON_VALIDATION_MODE=http,EVOLUTION_GENERATIONS=2,AUTO_EVOLUTION=${{ vars.AUTO_EVOLUTION || 'false' }},SIDE_B_SCHEDULER_ENABLED=true,TOP_LEVEL_ORCHESTRATOR_ENABLED=${{ vars.TOP_LEVEL_ORCHESTRATOR_ENABLED || 'true' }},DISCOVERY_COMPOSE_ENABLED=true,MARKET_API_URL=https://api.twelvedata.com,TWELVE_DATA_API_URL=https://api.twelvedata.com,EODHD_BASE_URL=https://eodhd.com/api \
            --set-secrets AI_API_KEY=AI_API_KEY:latest,AI_MODEL=AI_MODEL:latest,AI_BASE_URL=AI_BASE_URL:latest,AI_MODEL_OVERRIDE_ALL=AI_MODEL_OVERRIDE_ALL:latest,CRON_SECRET=CRON_SECRET:latest,MAIL_SECURITY_TOKEN=MAIL_SECURITY_TOKEN:latest,DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,CTRADER_CLIENT_ID=CTRADER_CLIENT_ID:latest,CTRADER_CLIENT_SECRET=CTRADER_CLIENT_SECRET:latest,CTRADER_REDIRECT_URI=CTRADER_REDIRECT_URI:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,TWELVE_DATA_API_KEY=TWELVE_DATA_API_KEY:latest,EODHD_API_KEY=EODHD_API_KEY:latest

      - name: デプロイ後の動作確認（最大5分待機）
        run: |
          for i in {1..30}; do
            echo "確認中... ($i/30)"
            if curl -s -f ${{ env.PRODUCTION_API_URL }}/health > /dev/null 2>&1; then
              echo "✅ API が正常に起動しました"
              exit 0
            fi
            sleep 10
          done
          echo "❌ API の起動確認がタイムアウトしました"
          exit 1


  # ── 3. DBマイグレーション（prisma/ 変更時のみ） ──
  run-migration:
    name: Run DB Migration (if needed)
    runs-on: ubuntu-latest
    needs: [deploy-gcp]
    outputs:
      migration_ran: ${{ steps.check.outputs.should_migrate }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: prisma/ ディレクトリの変更を検知
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行: マイグレーションを実行します"
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff HEAD~1 --name-only -- prisma/ | wc -l | tr -d ' ')
            if [ "$CHANGED" -gt "0" ]; then
              echo "✅ prisma/ に変更あり ($CHANGED ファイル): マイグレーションを実行します"
              git diff HEAD~1 --name-only -- prisma/
              echo "should_migrate=true" >> $GITHUB_OUTPUT
            else
              echo "⏭️ prisma/ に変更なし: マイグレーションをスキップします"
              echo "should_migrate=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: GCP 認証
        if: steps.check.outputs.should_migrate == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI セットアップ
        if: steps.check.outputs.should_migrate == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Cloud Run マイグレーションジョブを実行
        if: steps.check.outputs.should_migrate == 'true'
        run: |
          echo "🔄 マイグレーションジョブを実行中..."
          gcloud run jobs execute trader-note-migrate \
            --region ${{ env.GCP_REGION }} \
            --wait
          echo "✅ マイグレーション完了"

  # ── 4. 本番 E2E テスト ──
  e2e-production:
    name: Production E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-gcp, run-migration]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: API ヘルスチェック
        run: |
          echo "⏳ API の到達確認中..."
          for i in {1..6}; do
            if curl -s -f ${{ env.PRODUCTION_API_URL }}/health > /dev/null 2>&1; then
              echo "✅ API 到達確認: OK"
              exit 0
            fi
            echo "待機中... ($i/6)"
            sleep 10
          done
          echo "⚠️ API に到達できませんが、E2E テストを続行します"

      - name: 本番公開面 Playwright smoke 実行
        run: npm run test:e2e:production:public
        env:
          PRODUCTION_API_URL: ${{ env.PRODUCTION_API_URL }}
          PRODUCTION_UI_URL: ${{ env.PRODUCTION_UI_URL }}

      - name: Playwright レポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-report
          path: playwright-report-production/
          retention-days: 14

      - name: デプロイ完了サマリー
        if: success()
        run: |
          echo "================================"
          echo "🚀 本番デプロイ完了"
          echo "================================"
          echo ""
          echo "  ✅ API: ${{ env.PRODUCTION_API_URL }} (GCP Cloud Run)"
          echo "  ✅ UI:  ${{ env.PRODUCTION_UI_URL }} (Vercel)"
          echo "  ✅ DB:  Supabase"
          echo "  ✅ 本番公開面 smoke: 合格"

      - name: E2E テスト失敗時の通知
        if: failure()
        run: |
          echo "❌ 本番 E2E テスト失敗"
          echo "ロールバックの必要性を評価してください"
          echo "詳細は GitHub Actions ログを確認"

  # ── 5. Cloud Scheduler セットアップ（マッチングパイプライン 15分cron） ──
  setup-scheduler:
    name: Setup Cloud Scheduler (Matching Pipeline)
    runs-on: ubuntu-latest
    needs: [e2e-production]
    steps:
      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI セットアップ
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: CRON_SECRET を取得
        id: cron-secret
        run: |
          SECRET=$(gcloud secrets versions access latest --secret=CRON_SECRET --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "")
          if [ -z "$SECRET" ]; then
            echo "⚠️ CRON_SECRET が取得できません。Scheduler セットアップをスキップします。"
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
            echo "::add-mask::$SECRET"
            echo "value=$SECRET" >> $GITHUB_OUTPUT
          fi

      - name: Cloud Scheduler ジョブを作成/更新（マッチングパイプライン 15分）
        if: steps.cron-secret.outputs.has_secret == 'true'
        run: |
          JOB_NAME="matching-pipeline-15min"
          SCHEDULE="*/15 * * * *"
          URI="${{ env.PRODUCTION_API_URL }}/api/cron/matching-pipeline"
          SECRET="${{ steps.cron-secret.outputs.value }}"

          # 既存ジョブがあるか確認
          if gcloud scheduler jobs describe "$JOB_NAME" \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "📝 既存ジョブを更新: $JOB_NAME"
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --http-method=GET \
              --update-headers="Authorization=Bearer $SECRET" \
              --time-zone="Asia/Tokyo" \
              --description="マッチングパイプライン Side-A+B 統合（15分間隔）" \
              --attempt-deadline=300s
          else
            echo "🆕 新規ジョブを作成: $JOB_NAME"
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --http-method=GET \
              --headers="Authorization=Bearer $SECRET" \
              --time-zone="Asia/Tokyo" \
              --description="マッチングパイプライン Side-A+B 統合（15分間隔）" \
              --attempt-deadline=300s
          fi
          echo "✅ Cloud Scheduler セットアップ完了: $JOB_NAME ($SCHEDULE)"

      - name: Cloud Scheduler ジョブを作成/更新（ストラテジーライブ評価 15分）
        if: steps.cron-secret.outputs.has_secret == 'true'
        run: |
          # Phase γ-1: ストラテジー条件のライブ評価 + アラート発火（柱2）。
          # マッチングパイプライン（毎時 0/15/30/45 分）と負荷を分散するため 7 分オフセット。
          JOB_NAME="strategy-alerts-15min"
          SCHEDULE="7,22,37,52 * * * *"
          URI="${{ env.PRODUCTION_API_URL }}/api/cron/strategy-alerts"
          SECRET="${{ steps.cron-secret.outputs.value }}"

          if gcloud scheduler jobs describe "$JOB_NAME" \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} > /dev/null 2>&1; then
            echo "📝 既存ジョブを更新: $JOB_NAME"
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --http-method=GET \
              --update-headers="Authorization=Bearer $SECRET" \
              --time-zone="Asia/Tokyo" \
              --description="ストラテジー条件ライブ評価+アラート発火（15分間隔）" \
              --attempt-deadline=300s
          else
            echo "🆕 新規ジョブを作成: $JOB_NAME"
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --schedule="$SCHEDULE" \
              --uri="$URI" \
              --http-method=GET \
              --headers="Authorization=Bearer $SECRET" \
              --time-zone="Asia/Tokyo" \
              --description="ストラテジー条件ライブ評価+アラート発火（15分間隔）" \
              --attempt-deadline=300s
          fi
          echo "✅ Cloud Scheduler セットアップ完了: $JOB_NAME ($SCHEDULE)"
