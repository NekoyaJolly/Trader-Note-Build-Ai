name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 毎日 18:00 UTC（03:00 JST）にセキュリティ監査を実行
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: 'Run full paid API tests (costs money)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 同一ブランチで古い CI がハングしたまま残ると、Actions キューを圧迫するため新しい実行を優先する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_ENV: test
  CI: true

jobs:
  # ── 1. Lint & TypeScript コンパイルチェック ──
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: フロントエンド依存関係をインストール
        run: cd src/frontend && npm ci

      - name: Prisma クライアント生成
        run: npx prisma generate

      - name: TypeScript コンパイル確認
        run: npx tsc --noEmit

      - name: Backend ESLint チェック
        run: npm run lint:backend

      - name: Frontend TypeScript コンパイル確認
        run: cd src/frontend && npx tsc --noEmit

      - name: Frontend ESLint チェック
        run: cd src/frontend && npm run lint

  # ── 2. ユニットテスト（DB/外部依存なし） ──
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma セットアップ
        run: npx prisma generate

      - name: Jest ユニットテスト実行
        run: npm run test:unit -- --coverage --passWithNoTests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_API_MOCK: 'true'
          RUN_FULL_PAID_API_TESTS: 'false'

      - name: テストカバレッジレポートアップロード
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ── 2.5. フロントエンドテスト ──
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: フロントエンド依存関係をインストール
        run: npm ci
        working-directory: src/frontend

      - name: Frontend ユニットテスト実行
        run: npm test
        working-directory: src/frontend

  # ── 3. DB 統合テスト（使い捨て service container、低並列） ──
  # テストは TRUNCATE を含む破壊的操作を行うため、本番 Supabase ではなく
  # ジョブ内で起動する PostgreSQL service container に対して実行する。
  # (本番 DB に対して実行され本番データが TRUNCATE された事故の再発防止、2026-06-11)
  # 本番 secrets.DATABASE_URL への接続は「未適用マイグレーション自己回復」ステップのみに限定する。
  db-integration-tests:
    name: DB Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradeassist_test
          POSTGRES_PASSWORD: tradeassist_test
          POSTGRES_DB: tradeassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeassist_test -d tradeassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # テスト専用のローカル接続文字列 (ジョブ終了とともに破棄される)
      TEST_DATABASE_URL: postgresql://tradeassist_test:tradeassist_test@localhost:5432/tradeassist_test
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      # prisma generate は DB 接続不要のため本番 URL を渡さない
      - name: Prisma セットアップ
        run: npx prisma generate

      # push 時のみ未適用マイグレーションを自己回復的に適用。
      - name: 未適用マイグレーションを検出（push 時のみ）
        id: migrate_check
        if: github.event_name == 'push'
        run: |
          set +e
          npx prisma migrate status
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "✅ マイグレーションは最新、deploy をスキップ"
          elif [ $code -eq 1 ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ 未適用マイグレーションを検出、deploy を実行します"
          else
            echo "❌ prisma migrate status が予期しない exit code $code で失敗"
            exit $code
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Prisma マイグレーション適用（未適用あり時のみ）
        if: steps.migrate_check.outputs.pending == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # service container に全マイグレーションを適用してテスト用スキーマを構築する
      - name: テスト用 DB にマイグレーション適用（service container）
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: DB 統合テスト実行（低並列）
        run: npm run test:integration:db -- --passWithNoTests
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_API_MOCK: 'true'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          RUN_FULL_PAID_API_TESTS: ${{ github.event.inputs.run_full_tests || 'false' }}

  # ── 4. E2E テスト（Playwright） ──
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests, frontend-tests, db-integration-tests]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール（ルート）
        run: npm ci

      - name: 依存関係をインストール（フロントエンド）
        run: cd src/frontend && npm ci

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: バックエンドサーバー起動
        run: npm run dev:backend > /tmp/backend.log 2>&1 &
        env:
          NODE_ENV: development
          PORT: 3100
          BACKEND_PORT: 3100
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CRON_ENABLED: 'false'
          SIDE_B_SCHEDULER_ENABLED: 'false'

      - name: バックエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3100/health > /dev/null 2>&1; then
              echo "✅ バックエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ バックエンド起動タイムアウト"
          echo "=== バックエンドログ ==="
          cat /tmp/backend.log
          exit 1

      - name: フロントエンドサーバー起動
        run: cd src/frontend && npm run dev > /tmp/frontend.log 2>&1 &
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3100

      - name: フロントエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3102 > /dev/null 2>&1; then
              echo "✅ フロントエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ フロントエンド起動タイムアウト"
          echo "=== フロントエンドログ ==="
          cat /tmp/frontend.log
          exit 1

      - name: Playwright E2E テスト実行
        run: npm run test:e2e
        env:
          SKIP_WEBSERVER: 'true'
          NODE_ENV: test

      - name: Playwright レポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: テスト動画をアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-videos/
          retention-days: 7

  # ── 5. セキュリティ監査 ──
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR またはスケジュール実行時のみ
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: npm audit でセキュリティチェック
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ── 6. Docker ビルド検証 (pre-merge ゲート) ──
  #
  # Production Deployment (deploy.yml) で走る `docker build` を **PR 段階で同じ環境で再現** する。
  # 過去 (PR #184, 2026-05-14) に Dockerfile の `COPY package*.json ./` が `.npmrc` を含まない
  # ことが原因で deploy が #457 以降 15 連続失敗した。lint / typecheck / jest はローカル
  # `.npmrc` の `legacy-peer-deps=true` 経由で通っていたため、Docker 内の `npm ci` が strict
  # mode で失敗するという食い違いを CI で捕まえられなかった。
  #
  # 本ジョブで `docker build .` を走らせて pre-merge で同じ食い違いを検出する。
  # 失敗例: Dockerfile の COPY 行から `.npmrc` 抜け / 新規 builder stage で `npm ci` 直走り。
  #
  # WORKFLOW.md §9 (post-merge 確認フロー) と連動する: 本ゲートが通れば post-merge の
  # Production Deployment 失敗確率は大幅に減るため、Phase 着手時の瞬間チェックが現実的になる。
  docker-build:
    name: Docker Build (root Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Docker Buildx セットアップ (cache 活用のため)
        uses: docker/setup-buildx-action@v3

      - name: Docker ビルド検証 (本番イメージ相当、push しない)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # cache を使ってビルド時間短縮 (ESLint 厳格化後の長時間化に備える)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # CI 上では tag 不要 (push しないため)
          tags: trader-note-build-ai:ci-check
