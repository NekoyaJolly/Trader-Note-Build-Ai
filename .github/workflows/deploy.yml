name: Production Deployment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ対象環境'
        required: true
        type: choice
        options:
          - gcp-api
          - vercel-ui
          - both

env:
  NODE_VERSION: '22'
  GCP_PROJECT_ID: ai-note-486020
  GCP_REGION: asia-northeast1
  GCP_SERVICE_NAME: trader-note
  GCP_IMAGE: gcr.io/ai-note-486020/trader-note:latest
  PRODUCTION_API_URL: https://trader-note-571157808050.asia-northeast1.run.app
  PRODUCTION_UI_URL: https://trader-note-build-ai.vercel.app

jobs:
  # ── 1. GCP Cloud Run（API）へのデプロイ ──
  deploy-gcp:
    name: Deploy API to GCP Cloud Run
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'gcp-api' || github.event.inputs.environment == 'both'))
    environment:
      name: production
      url: ${{ env.PRODUCTION_API_URL }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: GCP 認証
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI セットアップ
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Docker 認証設定
        run: gcloud auth configure-docker --quiet

      - name: コンテナイメージをビルド＆プッシュ
        run: |
          docker build -t ${{ env.GCP_IMAGE }} .
          docker push ${{ env.GCP_IMAGE }}

      - name: Cloud Run へデプロイ
        run: |
          gcloud run deploy ${{ env.GCP_SERVICE_NAME }} \
            --image ${{ env.GCP_IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed

      - name: デプロイ後の動作確認（最大5分待機）
        run: |
          for i in {1..30}; do
            echo "確認中... ($i/30)"
            if curl -s -f ${{ env.PRODUCTION_API_URL }}/health > /dev/null 2>&1; then
              echo "✅ API が正常に起動しました"
              exit 0
            fi
            sleep 10
          done
          echo "❌ API の起動確認がタイムアウトしました"
          exit 1

  # ── 2. Vercel（UI）へのデプロイ ──
  deploy-vercel:
    name: Deploy UI to Vercel
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'vercel-ui' || github.event.inputs.environment == 'both'))
    environment:
      name: production
      url: ${{ env.PRODUCTION_UI_URL }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Vercel へのデプロイ
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true

  # ── 3. 本番 E2E テスト ──
  e2e-production:
    name: Production E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-gcp, deploy-vercel]
    # GCP と Vercel の両方が成功した場合、またはどちらかがスキップで残りが成功した場合
    if: |
      always() &&
      (needs.deploy-gcp.result == 'success' || needs.deploy-gcp.result == 'skipped') &&
      (needs.deploy-vercel.result == 'success' || needs.deploy-vercel.result == 'skipped') &&
      !(needs.deploy-gcp.result == 'skipped' && needs.deploy-vercel.result == 'skipped')
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 本番 E2E テスト実行
        run: bash scripts/production-e2e-test.sh
        env:
          PRODUCTION_API_URL: ${{ env.PRODUCTION_API_URL }}
          PRODUCTION_UI_URL: ${{ env.PRODUCTION_UI_URL }}
          WAIT_TIME: 2

      - name: デプロイ完了サマリー
        if: success()
        run: |
          echo "================================"
          echo "🚀 本番デプロイ完了"
          echo "================================"
          echo ""
          echo "  ✅ API: ${{ env.PRODUCTION_API_URL }}"
          echo "  ✅ UI: ${{ env.PRODUCTION_UI_URL }}"
          echo "  ✅ DB: Supabase"
          echo "  ✅ E2E テスト: 合格"

      - name: E2E テスト失敗時の通知
        if: failure()
        run: |
          echo "❌ 本番 E2E テスト失敗"
          echo "ロールバックの必要性を評価してください"
          echo "詳細は GitHub Actions ログを確認"
