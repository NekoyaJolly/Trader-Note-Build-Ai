name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io

jobs:
  # TypeScript コンパイル & lint チェック
  lint-and-build:
    name: TypeScript Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: TypeScript コンパイル確認（エラーのみ）
        run: npx tsc --noEmit

      - name: ESLint チェック（設定がある場合）
        run: npm run lint --if-present || echo "ESLint スキップ"

  # ユニット＆統合テスト実行
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      # PostgreSQL テスト用（オプション）
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma セットアップ
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}

      - name: Jest ユニットテスト実行
        run: npm test -- --coverage --passWithNoTests
        env:
          # テスト用環境変数（必要に応じて調整）
          NODE_ENV: test
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}

      - name: テストカバレッジレポートアップロード
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ローカル E2E テスト（開発環境での動作確認）
  e2e-local:
    name: Local E2E Tests
    runs-on: ubuntu-latest
    services:
      # PostgreSQL テスト用
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma セットアップ
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}

      - name: 開発サーバー起動（バックグラウンド）
        run: npm run dev > /tmp/dev-server.log 2>&1 &
        env:
          NODE_ENV: development
          PORT: 3100
          DATABASE_URL: postgresql://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}

      - name: サーバー起動待機（最大30秒）
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3100/health > /dev/null 2>&1; then
              echo "サーバー起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/30)"
            sleep 1
          done
          echo "サーバー起動タイムアウト"
          cat /tmp/dev-server.log
          exit 1

      - name: ローカル E2E テスト実行
        run: bash scripts/local-e2e-test.sh
        env:
          API_URL: http://localhost:3100
          WAIT_TIME: 1

  # ビルド成功確認
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: ビルド実行（該当する場合）
        run: npm run build --if-present || echo "Build script not found"

  # 本番デプロイ通知（main ブランチのみ）
  notify-deployment:
    name: Notify Deployment Readiness
    runs-on: ubuntu-latest
    needs: [lint-and-build, test, e2e-local, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: デプロイ準備完了ログ
        run: |
          echo "✅ CI/CD パイプライン完了"
          echo "📦 本番デプロイ準備完了"
          echo "🚀 GCP Cloud Run & Vercel へのデプロイが可能です"
          echo ""
          echo "次のステップ:"
          echo "1. GCP Cloud Run にバックエンドをデプロイ"
          echo "2. Vercel フロントエンドにデプロイ"
          echo "3. 本番 E2E テスト実行"
