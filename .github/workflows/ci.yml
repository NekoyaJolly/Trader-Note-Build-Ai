name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # TypeScript コンパイル & lint チェック
  lint-and-typecheck:
    name: TypeScript Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: バックエンド依存関係をインストール
        run: npm ci

      - name: フロントエンド依存関係をインストール
        run: cd src/frontend && npm ci

      - name: Prisma クライアント生成
        run: npx prisma generate

      - name: TypeScript コンパイル確認（バックエンド）
        run: npx tsc --noEmit

      - name: ESLint チェック（設定がある場合）
        run: npm run lint --if-present || echo "ESLint スキップ"

  # ユニット＆統合テスト実行
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma セットアップ
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      - name: Jest ユニットテスト実行
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

  # ビルド確認（バックエンド + フロントエンド）
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: バックエンド依存関係をインストール
        run: npm ci

      - name: フロントエンド依存関係をインストール
        run: cd src/frontend && npm ci

      - name: Prisma クライアント生成
        run: npx prisma generate

      - name: バックエンドビルド
        run: npx tsc

      - name: フロントエンドビルド
        run: cd src/frontend && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://trader-note-build-ai-production.up.railway.app

  # デプロイ通知（main ブランチのみ）
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: デプロイ準備完了
        run: |
          echo "✅ CI パイプライン完了"
          echo "🚀 Railway & Vercel への自動デプロイが開始されます"
          echo ""
          echo "本番環境:"
          echo "  - API: https://trader-note-build-ai-production.up.railway.app"
          echo "  - UI: https://trader-note-build-ai.vercel.app"
