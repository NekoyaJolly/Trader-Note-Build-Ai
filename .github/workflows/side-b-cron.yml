# Side-B 自動化 Cron ワークフロー
#
# 目的: GitHub Actionsで Side-Bの自動化タスクを定期実行する
#
# スケジュール:
#   - プラン生成: 4 時間ごと (0/4/8/12/16/20 UTC = JST 09/13/17/21/01/05)、1 日 6 回
#     (2026-05-24 変更: 旧 daily 1 回 → 4h ごと 6 回。仮説生成サンプルを増やして
#      Phase B 後の screening 観察を加速する目的、PR #251)
#   - 監視実行: 毎時 0 分 (4h ごとの cron と重なる時刻は plan + monitor 並行)
#
# 必要なシークレット:
#   - CRON_SECRET: Cron認証用秘密鍵
#   - GCP_API_URL: GCP Cloud Run API URL（例: https://trader-note-571157808050.asia-northeast1.run.app）

name: Side-B Automation Cron

on:
  schedule:
    # プラン生成: 4 時間ごと (= JST 09/13/17/21/01/05、1 日 6 回)
    - cron: '0 */4 * * *'
    # 監視実行: 毎時 0 分 (= 4h cron と重なる時刻は両方走る、scheduler 側で lastPlanRun 制御)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '実行するタスク'
        required: true
        default: 'monitor'
        type: choice
        options:
          - daily-plan
          - monitor
          - health

env:
  GCP_API_URL: ${{ secrets.GCP_API_URL || 'https://trader-note-571157808050.asia-northeast1.run.app' }}

jobs:
  daily-plan:
    name: プラン生成 (4h ごと)
    runs-on: ubuntu-latest
    # 4h ごとのスケジュール (= 0/4/8/12/16/20 UTC)、または手動実行で daily-plan を選択した場合
    # ※ job 名は API path (/api/cron/side-b/daily-plan) と整合のため "daily-plan" のまま維持
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 */4 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'daily-plan')
    steps:
      - name: 日次プラン生成を実行
        run: |
          echo "🚀 日次プラン生成を開始..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.GCP_API_URL }}/api/cron/side-b/daily-plan")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ 日次プラン生成が成功しました"
          else
            echo "❌ 日次プラン生成が失敗しました"
            exit 1
          fi

  monitor:
    name: 監視実行
    runs-on: ubuntu-latest
    # 毎時スケジュール（00:00 UTC以外）、または手動実行で monitor を選択した場合
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'monitor')
    steps:
      - name: 監視を実行
        run: |
          echo "🔍 監視実行を開始..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.GCP_API_URL }}/api/cron/side-b/monitor")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ 監視実行が成功しました"
          else
            echo "❌ 監視実行が失敗しました"
            exit 1
          fi

  health-check:
    name: ヘルスチェック
    runs-on: ubuntu-latest
    # 手動実行で health を選択した場合のみ
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'health'
    steps:
      - name: ヘルスチェックを実行
        run: |
          echo "🏥 ヘルスチェックを開始..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.GCP_API_URL }}/api/cron/health")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ヘルスチェックが成功しました"
          else
            echo "❌ ヘルスチェックが失敗しました"
            exit 1
          fi

