name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 毎日午前3時（JST）に実行
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_ai_tests:
        description: 'Run AI-driven tests'
        required: false
        default: 'false'

jobs:
  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係をインストール（ルート）
        run: npm ci

      - name: 依存関係をインストール（フロントエンド）
        run: cd src/frontend && npm ci

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: バックエンドサーバー起動（バックグラウンド）
        run: npm run dev:backend > /tmp/backend.log 2>&1 &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKEND_PORT: 3100
          PORT: 3100
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CRON_ENABLED: 'false'
          SIDE_B_SCHEDULER_ENABLED: 'false'

      - name: バックエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3100/health > /dev/null 2>&1; then
              echo "✅ バックエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ バックエンド起動タイムアウト"
          echo "=== バックエンドログ ==="
          cat /tmp/backend.log
          exit 1

      - name: フロントエンドサーバー起動（バックグラウンド）
        run: cd src/frontend && npm run dev > /tmp/frontend.log 2>&1 &
        env:
          NODE_ENV: test

      - name: フロントエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3102 > /dev/null 2>&1; then
              echo "✅ フロントエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ フロントエンド起動タイムアウト"
          echo "=== フロントエンドログ ==="
          cat /tmp/frontend.log
          exit 1

      - name: E2E テスト実行
        env:
          SKIP_WEBSERVER: 'true'
          NODE_ENV: test
        run: npm run test:e2e

      - name: Playwright レポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: テスト動画をアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-videos/
          retention-days: 7

      - name: テスト結果をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.json
            test-results.xml
          retention-days: 30

  ai-tests:
    name: AI-Driven Tests
    runs-on: ubuntu-latest
    # スケジュール実行または手動実行時のみAIテストを実行
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ai_tests == 'true')

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係をインストール
        run: |
          npm ci
          cd src/frontend && npm ci && cd ../..

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: AI駆動テスト実行
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKEND_PORT: 3100
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: npm run test:ai

      - name: AIテストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-report
          path: playwright-report/ai-test-report.json
          retention-days: 90

      - name: テストシナリオをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scenarios
          path: tests/ai-orchestrator/test-scenarios.json
          retention-days: 90

  notify-results:
    name: テスト結果通知
    runs-on: ubuntu-latest
    needs: [playwright-tests]
    if: always()
    
    steps:
      - name: テスト結果サマリー
        run: |
          echo "## E2Eテスト実行結果 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ブランチ: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- コミット: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 実行者: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.playwright-tests.result }}" == "success" ]; then
            echo "✅ Playwright E2Eテスト: 成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Playwright E2Eテスト: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
