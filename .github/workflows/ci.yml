name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 毎日 18:00 UTC（03:00 JST）にセキュリティ監査を実行
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: 'Run full paid API tests (costs money)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_ai_tests:
        description: 'Run AI-driven tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '22'
  NODE_ENV: test
  CI: true

jobs:
  # ── 1. Lint & TypeScript コンパイルチェック ──
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma クライアント生成
        run: npx prisma generate

      - name: TypeScript コンパイル確認
        run: npx tsc --noEmit

      - name: ESLint チェック
        run: npm run lint --if-present || echo "ESLint スキップ"

  # ── 2. ユニット & 統合テスト ──
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: npm ci

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Jest テスト実行
        run: npm test -- --coverage --passWithNoTests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          RUN_FULL_PAID_API_TESTS: ${{ github.event.inputs.run_full_tests || 'false' }}

      - name: テストカバレッジレポートアップロード
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ── 3. E2E テスト（Playwright） ──
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール（ルート）
        run: npm ci

      - name: 依存関係をインストール（フロントエンド）
        run: cd src/frontend && npm ci

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: バックエンドサーバー起動
        run: npm run dev:backend > /tmp/backend.log 2>&1 &
        env:
          NODE_ENV: development
          PORT: 3100
          BACKEND_PORT: 3100
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: gpt-4o-mini
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CRON_ENABLED: 'false'
          SIDE_B_SCHEDULER_ENABLED: 'false'

      - name: バックエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3100/health > /dev/null 2>&1; then
              echo "✅ バックエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ バックエンド起動タイムアウト"
          echo "=== バックエンドログ ==="
          cat /tmp/backend.log
          exit 1

      - name: フロントエンドサーバー起動
        run: cd src/frontend && npm run dev > /tmp/frontend.log 2>&1 &
        env:
          NODE_ENV: test

      - name: フロントエンド起動待機（最大60秒）
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3102 > /dev/null 2>&1; then
              echo "✅ フロントエンド起動確認: OK"
              exit 0
            fi
            echo "待機中... ($i/60)"
            sleep 1
          done
          echo "❌ フロントエンド起動タイムアウト"
          echo "=== フロントエンドログ ==="
          cat /tmp/frontend.log
          exit 1

      - name: Playwright E2E テスト実行
        run: npm run test:e2e
        env:
          SKIP_WEBSERVER: 'true'
          NODE_ENV: test

      - name: Playwright レポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: テスト動画をアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-videos/
          retention-days: 7

  # ── 4. セキュリティ監査 ──
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # PR またはスケジュール実行時のみ
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: npm audit でセキュリティチェック
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ── 5. AI-Driven テスト（手動 or スケジュール限定） ──
  ai-tests:
    name: AI-Driven Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ai_tests == 'true')
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 依存関係をインストール
        run: |
          npm ci
          cd src/frontend && npm ci && cd ../..

      - name: Playwright をインストール
        run: npx playwright install --with-deps chromium

      - name: Prisma セットアップ
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: AI駆動テスト実行
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKEND_PORT: 3100
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: npm run test:ai

      - name: AIテストレポートをアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-report
          path: playwright-report/ai-test-report.json
          retention-days: 90
